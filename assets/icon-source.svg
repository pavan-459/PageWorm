  <path d="M190 800 C300 778 400 784 470 812"/><path d="M190 830 C300 808 400 814 470 842"/><path d="M190 860 C300 838 400 844 470 872"/>
  <path d="M760 790 C800 786 830 786 850 790"/><path d="M790 850 C820 846 840 846 856 850"/>
</g>

<!-- holes -->
<ellipse cx="662" cy="812" rx="78" ry="26" fill="url(#hole)"/>
<ellipse cx="330" cy="842" rx="46" ry="16" fill="url(#hole)"/>

<!-- tail popping out of the left page -->
<g clip-path="url(#above2)">
