  <circle cx="306" cy="776" r="30" fill="url(#skin)"/>
  <ellipse cx="296" cy="764" rx="10" ry="6" fill="#fff" opacity="0.6"/>
</g>

<!-- body rising out of the right page, getting bigger as it curves toward us -->
<g clip-path="url(#above)">
  <circle cx="664" cy="784" r="74" fill="url(#skin2)"/>
  <ellipse cx="640" cy="748" rx="22" ry="12" fill="#fff" opacity="0.5"/>
</g>
