<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#FFF8EC"/><stop offset="0.6" stop-color="#FFE7C7"/><stop offset="1" stop-color="#FFC98F"/></radialGradient>
  <radialGradient id="skin" cx="32%" cy="28%" r="80%"><stop offset="0" stop-color="#E4F5C6"/><stop offset="0.35" stop-color="#A8D86E"/><stop offset="0.8" stop-color="#6FAE35"/><stop offset="1" stop-color="#3F7A1C"/></radialGradient>
  <radialGradient id="skin2" cx="32%" cy="28%" r="80%"><stop offset="0" stop-color="#D6EFB3"/><stop offset="0.35" stop-color="#97CD5A"/><stop offset="0.8" stop-color="#5F9F2A"/><stop offset="1" stop-color="#356C15"/></radialGradient>
  <radialGradient id="rim" cx="75%" cy="80%" r="45%"><stop offset="0" stop-color="#FFF3B0" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/></radialGradient>
  <radialGradient id="ao" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1F3D0C" stop-opacity="0.45"/><stop offset="1" stop-color="#1F3D0C" stop-opacity="0"/></radialGradient>
  <radialGradient id="cheek" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF7A6B" stop-opacity="0.75"/><stop offset="1" stop-color="#FF7A6B" stop-opacity="0"/></radialGradient>
  <radialGradient id="iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#8A5A3B"/><stop offset="1" stop-color="#3A2214"/></radialGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6F1FF"/></linearGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A4A35"/><stop offset="1" stop-color="#3E2218"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1E4D0"/></linearGradient>
  <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A65"/><stop offset="1" stop-color="#C9462A"/></linearGradient>
  <radialGradient id="hole" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#2A1A10"/><stop offset="1" stop-color="#6B4A30"/></radialGradient>
  <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A5A7A"/><stop offset="1" stop-color="#1E2638"/></linearGradient>
  <radialGradient id="gold" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFF1A8"/><stop offset="0.5" stop-color="#FFC531"/><stop offset="1" stop-color="#C98A00"/></radialGradient>
  <radialGradient id="ground" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8A5A2E" stop-opacity="0.35"/><stop offset="1" stop-color="#8A5A2E" stop-opacity="0"/></radialGradient>
  <clipPath id="above"><rect x="0" y="0" width="1024" height="812"/><ellipse cx="662" cy="812" rx="78" ry="26"/></clipPath>
  <clipPath id="above2"><rect x="0" y="0" width="1024" height="842"/><ellipse cx="330" cy="842" rx="46" ry="16"/></clipPath>
</defs>

<rect width="1024" height="1024" fill="url(#bg)"/>
