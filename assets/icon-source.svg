<circle cx="372" cy="372" r="76" fill="url(#lens)"/>
<circle cx="562" cy="368" r="76" fill="url(#lens)"/>
<circle cx="384" cy="382" r="42" fill="url(#iris)"/><circle cx="384" cy="382" r="24" fill="#120A06"/>
<circle cx="370" cy="366" r="13" fill="#fff"/><circle cx="398" cy="396" r="6" fill="#fff"/>
<circle cx="550" cy="378" r="42" fill="url(#iris)"/><circle cx="550" cy="378" r="24" fill="#120A06"/>
<circle cx="536" cy="362" r="13" fill="#fff"/><circle cx="564" cy="392" r="6" fill="#fff"/>
