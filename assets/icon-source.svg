  <path d="M470 168 Q600 170 640 186 L646 276" stroke="#FFC531" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M632 270 L660 270 L668 330 L624 330 Z" fill="url(#gold)"/>
