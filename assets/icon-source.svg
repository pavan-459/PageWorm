<path d="M330 320 L360 304" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
<path d="M520 316 L550 300" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

<!-- grin with a buck tooth -->
